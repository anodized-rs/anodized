[package]
name = "anodized"
description.workspace = true

version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
repository.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true

[features]
default = []
hax = ["dep:hax-lib", "anodized-macros/hax"]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    "cfg(anodized_charon)",
    "cfg(anodized_discard_specs)",
    "cfg(anodized_embed_specs)",
    "cfg(anodized_hax)",
    "cfg(anodized_panic)",
    "cfg(anodized_print)",
    "cfg(anodized_try)",
]

[dependencies]
anodized-logic.workspace = true
anodized-macros.workspace = true
hax-lib = { optional = true, git = "https://github.com/cryspen/hax.git", branch = "anodized-example" }

[dev-dependencies]
pollster = "0.4"
trybuild = "1.0"
